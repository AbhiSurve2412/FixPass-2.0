<nav class="sidebar" aria-label="Admin navigation">
  <div class="sidebar__brand">
    <span class="sidebar__brand-text">Admin Panel</span>
  </div>

  @for (section of sections; track trackBySection($index, section)) {
    <div class="sidebar__section">
      <p class="sidebar__section-title">{{ section.title }}</p>
      <ul class="sidebar__nav" role="list">
        @for (item of section.items; track trackByItem($index, item)) {
          <li>
            <a
              class="sidebar__link"
              [routerLink]="item.route"
              routerLinkActive="sidebar__link--active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <svg
                class="sidebar__icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path [attr.d]="item.icon"/>
              </svg>
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
