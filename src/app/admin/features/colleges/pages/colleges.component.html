<div class="page">

  <!-- Header -->
  <div class="page__header">
    <div class="page__header-left">
      <h1 class="page__title">Colleges</h1>
      <p class="page__subtitle">Manage colleges grouped by university</p>
    </div>
    <button class="btn btn--primary" (click)="openCreate()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Add College
    </button>
  </div>

  <!-- Error -->
  @if (error()) {
    <div class="page__error" role="alert">{{ error() }}</div>
  }

  <!-- Toolbar -->
  <div class="page__toolbar">
    <app-search-bar
      [placeholder]="'Search colleges or universities...'"
      [value]="searchTerm()"
      (valueChange)="onSearch($event)"
    />
    <span class="page__count">
      {{ filtered().length }} {{ filtered().length === 1 ? 'result' : 'results' }}
    </span>
  </div>

  <!-- Grouped grid — Colleges grouped by University -->
  <app-grouped-grid
    [columns]="columns"
    [groups]="groups()"
    [loading]="loading()"
    [emptyTitle]="'No colleges found'"
    (action)="onGridAction($event)"
  />

  <!-- Modal -->
  <app-management-modal
    [visible]="modalVisible()"
    [mode]="modalMode()"
    [title]="modalTitle()"
    [fields]="fields()"
    [initialValues]="modalInitialValues()"
    (save)="onModalSave($event)"
    (cancel)="onModalCancel()"
  />

  <!-- Confirm delete -->
  <app-confirm-dialog
    [visible]="confirmVisible()"
    [itemName]="deleteTargetName() ?? undefined"
    (confirm)="onConfirmDelete()"
    (cancel)="onCancelDelete()"
  />

</div>
