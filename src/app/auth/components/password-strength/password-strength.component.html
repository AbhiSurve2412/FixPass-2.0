@let s = strength();

<div class="ps"
     role="progressbar"
     [attr.aria-valuenow]="s.score"
     aria-valuemin="0"
     aria-valuemax="6"
     aria-label="Password strength">
  <div class="ps__bars">
    @for (i of segments; track i) {
      <span
        class="ps__bar"
        [class.ps__bar--active]="i < s.score"
        [style.background-color]="i < s.score ? s.color : null">
      </span>
    }
  </div>

  @if (password()) {
    <span class="ps__label" [style.color]="s.color">{{ s.label }}</span>
  }
</div>
