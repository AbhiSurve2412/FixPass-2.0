<svg
  class="logo__icon"
  viewBox="0 0 32 32"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <linearGradient
      [attr.id]="gradientId"
      x1="0" y1="0" x2="32" y2="32"
      gradientUnits="userSpaceOnUse"
    >
      <!-- CSS custom properties resolve inside inline SVG in the DOM -->
      <stop stop-color="var(--color-primary)"/>
      <stop offset="1" stop-color="var(--color-accent)"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" [attr.fill]="'url(#' + gradientId + ')'"/>

  <!-- F mark — styled via CSS (.logo__mark) to avoid hardcoded fills -->
  <rect x="7" y="6.5" width="3.5" height="19" class="logo__mark"/>
  <rect x="7" y="6.5" width="16.5" height="3.5" class="logo__mark"/>
  <path d="M7 14H17L21.5 15.75L17 17.5H7Z" class="logo__mark"/>
</svg>

@if (showWordmark) {
  <span class="logo__wordmark">FixPass</span>
}
