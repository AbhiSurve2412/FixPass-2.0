<!-- FixPass brand mark — geometric F with forward-arrow middle arm -->
<svg
  class="logo__icon"
  viewBox="0 0 32 32"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <linearGradient
      [attr.id]="gradientId"
      x1="0" y1="0" x2="32" y2="32"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background: gradient rounded square -->
  <rect width="32" height="32" rx="7.5" [attr.fill]="'url(#' + gradientId + ')'"/>

  <!-- Vertical stem of the F -->
  <rect x="7" y="6.5" width="3.5" height="19" fill="white"/>

  <!-- Top arm of the F -->
  <rect x="7" y="6.5" width="16.5" height="3.5" fill="white"/>

  <!-- Middle arm: arrow tip points right, communicating forward progress -->
  <path d="M7 14H17L21.5 15.75L17 17.5H7Z" fill="white"/>
</svg>

@if (showWordmark) {
  <span class="logo__wordmark">FixPass</span>
}
