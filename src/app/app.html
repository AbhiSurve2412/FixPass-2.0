@if (!isAuthRoute()) {
  <app-navbar />
}

<main class="app-main"
      [class.app-main--admin]="isAdminRoute()"
      [class.app-main--study]="isStudyMaterialRoute()"
      [class.app-main--auth]="isAuthRoute()">
  <router-outlet />
</main>

@if (!isAdminRoute() && !isStudyMaterialRoute() && !isAuthRoute()) {
  <app-footer />
}
