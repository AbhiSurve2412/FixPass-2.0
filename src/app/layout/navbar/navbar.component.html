<header class="navbar" [class.navbar--open]="menuOpen()">

  <!-- ── Main bar ───────────────────────────────────────── -->
  <div class="navbar__bar">

    <!-- Brand -->
    <a class="navbar__brand" routerLink="/" (click)="closeMenu()" aria-label="FixPass home">
      <app-logo />
    </a>

    <!-- Desktop navigation -->
    <nav class="navbar__nav" aria-label="Main navigation">
      <ul class="navbar__nav-list" role="list">
        @for (item of navItems; track item.route) {
          <li>
            <a
              class="navbar__link"
              [routerLink]="item.route"
              routerLinkActive="navbar__link--active"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Desktop auth actions -->
    <div class="navbar__actions">
      <a class="btn btn--secondary btn--sm" routerLink="/login">Log in</a>
      <a class="btn btn--primary btn--sm" routerLink="/signup">Sign up free</a>
    </div>

    <!-- Mobile hamburger -->
    <button
      class="navbar__hamburger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation menu"
    >
      @if (!menuOpen()) {
        <!-- Hamburger icon -->
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      } @else {
        <!-- Close icon -->
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      }
    </button>

  </div>

  <!-- ── Mobile menu ────────────────────────────────────── -->
  @if (menuOpen()) {
    <div class="navbar__mobile-menu" role="navigation" aria-label="Mobile navigation">
      <ul class="navbar__mobile-nav" role="list">
        @for (item of navItems; track item.route) {
          <li>
            <a
              class="navbar__mobile-link"
              [routerLink]="item.route"
              routerLinkActive="navbar__mobile-link--active"
              (click)="closeMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>

      <div class="navbar__mobile-actions">
        <a
          class="btn btn--secondary btn--lg navbar__mobile-btn"
          routerLink="/login"
          (click)="closeMenu()"
        >Log in</a>
        <a
          class="btn btn--primary btn--lg navbar__mobile-btn"
          routerLink="/signup"
          (click)="closeMenu()"
        >Sign up free</a>
      </div>
    </div>
  }

</header>
