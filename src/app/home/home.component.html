@if (loading()) {
  <div class="home-loading" role="status" aria-label="Loading home page content">
    <span class="home-loading__spinner" aria-hidden="true"></span>
  </div>
}

@if (error()) {
  <div class="home-error" role="alert">
    <p>{{ error() }}</p>
  </div>
}

@if (!loading() && !error()) {
  <app-hero-showcase [hero]="hero()" [branches]="branches()" />
  <app-study-features [features]="features()" />
  <app-testimonials [testimonials]="testimonials()" />
  <app-how-it-works [steps]="steps()" />
  <app-why-fixpass [benefits]="benefits()" />
  <app-pricing [plans]="plans()" />
}
