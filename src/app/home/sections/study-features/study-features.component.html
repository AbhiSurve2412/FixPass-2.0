<section class="features">
  <div class="features__container">

    <app-section-header
      label="Study Material"
      title="Everything You Need to Prepare for Exams"
      subtitle="Phase 1 of FixPass focuses on providing complete exam preparation resources for university students.">
    </app-section-header>

    <div class="features__grid">
      @for (feature of features(); track trackByFeature($index, feature)) {
        <article class="feature-card" tabindex="0">

          <div class="feature-card__icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.75"
                 stroke-linecap="round" stroke-linejoin="round">
              <path [attr.d]="feature.icon"/>
            </svg>
          </div>

          <h3 class="feature-card__title">{{ feature.title }}</h3>
          <p class="feature-card__desc">{{ feature.description }}</p>

          <ul class="feature-card__list" role="list">
            @for (item of feature.items; track trackByItem($index)) {
              <li class="feature-card__item">
                <svg class="feature-card__check" width="14" height="14"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 13l4 4L19 7"/>
                </svg>
                {{ item }}
              </li>
            }
          </ul>

        </article>
      }
    </div>

  </div>
</section>
